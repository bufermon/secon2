    <script>
        // Ensure this script runs to update the year
        if (document.getElementById('current-year')) {
            document.getElementById('current-year').textContent = new Date().getFullYear();
        }
        // Smooth scroll for anchor links on pages that might have them (e.g., legal pages, services)
        // This might be better placed in a global script if used more broadly, or per-page if specific.
        // For now, keeping it here as legal pages were the last to add it.
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const targetId = this.getAttribute('href');
                const targetElement = document.querySelector(targetId);
                if(targetElement) {
                    targetElement.scrollIntoView({
                        behavior: 'smooth'
                    });
                }
            });
        });
    </script>
